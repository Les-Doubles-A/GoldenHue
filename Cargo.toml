[package]
name = "goldenhue"
version = "2.0.0"
edition = "2024"
authors = ["GoldenHue"]
description = "Générateur de palettes de couleurs ultra-optimisé en Rust (eframe/egui)"
build = "build.rs"

[[bin]]
name = "GoldenHue"
path = "src/main.rs"

[lib]
name = "goldenhue"
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "system_fonts",
    "clipboard",
    "links",
] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "bmp",
    "ico",
    "tiff",
    "tga",
    "pnm",
] }
rfd = "0.17.2"
arboard = { version = "3.7.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "6.0.0"
rand = "0.10.3"

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
panic = "abort"
strip = true
